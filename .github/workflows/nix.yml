name: Nix

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-nix
    - name: Nix Lint
      run: nix fmt . -- --ci

  eval:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-nix
    - name: Evaluate all packages
      run: ./ci/eval.sh

  package-test:

    # Runs the open-code-review review-scope canary (pkgs/open-code-review/test.nix):
    # a repository-root pkgs/ must stay inside the tool's review set, or every
    # Nix package source is dropped before the model sees it.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup-nix
    - name: Package tests
      run: ./ci/tests.sh
